<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IndiaMART AI Content & Catalog Generator · Direct Live Application</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090d16;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
    }
    .top-bar {
      height: 52px;
      background: #111827;
      border-bottom: 1px solid #1f2937;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.25rem;
      z-index: 50;
      position: relative;
    }
    .left-meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .live-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 10px #10b981;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.7; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.7; }
    }
    .app-title { font-size: 0.95rem; font-weight: 700; color: #fff; }
    .badge {
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.5rem;
      border-radius: 9999px;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: #f97316;
      color: #090d16;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.4rem 0.85rem;
      border-radius: 6px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-secondary {
      background: #1f2937;
      color: #cbd5e1;
      border: 1px solid #374151;
    }
    .btn-secondary:hover { background: #374151; }
    .view-container {
      width: 100%;
      height: calc(100% - 52px);
      position: relative;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    #previewModal {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(9, 13, 22, 0.95);
      z-index: 60;
      padding: 2rem;
      overflow-y: auto;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    #previewModal.active { display: flex; }
    .modal-card {
      max-width: 900px;
      width: 100%;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .modal-card img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      display: block;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="left-meta">
      <div class="live-dot"></div>
      <span class="app-title">IndiaMART AI Content & Catalog Generator</span>
      <span class="badge">RUNNING LIVE ON VERCEL</span>
    </div>
    <div class="controls">
      <button class="btn btn-secondary" onclick="togglePreview()">📊 View Result Output Preview</button>
      <a class="btn" href="https://nunes-social-post-machine-mu.vercel.app/" target="_blank">🚀 Open Direct App ↗</a>
      <a class="btn btn-secondary" href="https://github.com/AbishekPranavGV/IndiaMART-AI-Content-Catalog-Generator" target="_blank">GitHub</a>
    </div>
  </div>

  <div class="view-container">
    <iframe src="https://nunes-social-post-machine-mu.vercel.app/" title="IndiaMART AI Content & Catalog Generator Live Application"></iframe>

    <div id="previewModal">
      <div class="modal-card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
          <h3 style="font-size:1.1rem; font-weight:700;">Live System Result Output Preview</h3>
          <button class="btn btn-secondary" onclick="togglePreview()">Close ✕</button>
        </div>
        <img src="result_preview.svg" alt="IndiaMART AI Content & Catalog Generator Result Preview" />
      </div>
    </div>
  </div>

  <script>
    function togglePreview() {
      const m = document.getElementById('previewModal');
      m.classList.toggle('active');
    }
  </script>
</body>
</html>
